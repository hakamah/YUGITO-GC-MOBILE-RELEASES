name: Temporary Shifumi V4 source recovery

on:
  push:
    paths:
      - '.github/workflows/temp-shifumi-v4-source.yml'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download V3 PreBattle artifact
        uses: actions/download-artifact@v4
        with:
          name: shifumi-v3-prebattle
          path: /tmp/v3
          github-token: ${{ github.token }}
          repository: hakamah/YUGITO-GC-MOBILE-RELEASES
          run-id: 34636257278
      - name: Prepare compiled script
        run: |
          find /tmp/v3 -type f -maxdepth 3 -ls
          cp /tmp/v3/PreBattle.gdc /tmp/PreBattle.gdc
          test -s /tmp/PreBattle.gdc
      - name: Download GDRETools
        run: |
          curl -L -o /tmp/gdre.zip https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip
          unzip -q /tmp/gdre.zip -d /tmp/gdre
          chmod +x /tmp/gdre/gdre_tools.x86_64
      - name: Decompile current V3 source
        run: |
          mkdir -p /tmp/src
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/src
          test -s /tmp/src/PreBattle.gd
          grep -nE '_timer_badge|_draw_rps|_top|header|ANNULER|MENU|SHIFUMI|PREPARATION' /tmp/src/PreBattle.gd | head -120 || true
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: shifumi-v4-current-source
          path: /tmp/src/PreBattle.gd
          retention-days: 1
