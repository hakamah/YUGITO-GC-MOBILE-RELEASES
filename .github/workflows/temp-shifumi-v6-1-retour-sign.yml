name: Temporary exact Shifumi V6.1 RETOUR signer

on:
  push:
    paths:
      - '.github/workflows/temp-shifumi-v6-1-retour-sign.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
      - name: Build exact v2 signed-data
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_CONTENT_DIGEST_HEX: 'b4e7f7720072fd40facfe6a8a43daab12fb4e3eca2e908e7b996a5bfc9ac0d6353990e9b5186e39332229d14920aa91dbf7f752418131cfed74125ae470d2f95'
        run: |
          cat >/tmp/ExactSign.java <<'JAVA'
          import java.io.*; import java.nio.*; import java.security.*; import java.security.cert.Certificate;
          public class ExactSign {
            static byte[] le32(int x){return ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putInt(x).array();}
            static byte[] cat(byte[]... xs)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();for(byte[] x:xs)o.write(x);return o.toByteArray();}
            static byte[] lp(byte[] x)throws Exception{return cat(le32(x.length),x);}
            static byte[] hex(String s){byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}
            static String hx(byte[] b){StringBuilder s=new StringBuilder();for(byte x:b)s.append(String.format("%02X",x&255));return s.toString();}
            public static void main(String[] args)throws Exception{
              char[] sp=System.getenv("KS_PASS").toCharArray(), kp=System.getenv("KEY_PASS").toCharArray();
              KeyStore ks=KeyStore.getInstance("JKS"); try(InputStream in=new FileInputStream("/tmp/YUGITO_GC_RELEASE.keystore")){ks.load(in,sp);}
              String alias=System.getenv("KEY_ALIAS"); PrivateKey key=(PrivateKey)ks.getKey(alias,kp); Certificate cert=ks.getCertificate(alias);
              byte[] certDer=cert.getEncoded(), pub=cert.getPublicKey().getEncoded(), digest=hex(System.getenv("APK_CONTENT_DIGEST_HEX"));
              byte[] rec=cat(le32(0x0104),lp(digest)); byte[] sd=cat(lp(lp(rec)),lp(lp(certDer)),lp(new byte[0]));
              Signature sig=Signature.getInstance("SHA512withRSA"); sig.initSign(key); sig.update(sd); byte[] signature=sig.sign();
              try(FileOutputStream o=new FileOutputStream("/tmp/signed_data.bin")){o.write(sd);} try(FileOutputStream o=new FileOutputStream("/tmp/signature.bin")){o.write(signature);} try(FileOutputStream o=new FileOutputStream("/tmp/cert.der")){o.write(certDer);} try(FileOutputStream o=new FileOutputStream("/tmp/pub.der")){o.write(pub);}
              try(PrintWriter o=new PrintWriter("/tmp/meta.txt")){o.println("CERT_SHA1="+hx(MessageDigest.getInstance("SHA-1").digest(certDer)));o.println("CONTENT_DIGEST="+hx(digest));}
            }
          }
          JAVA
          javac /tmp/ExactSign.java
          java -cp /tmp ExactSign
          cat /tmp/meta.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shifumi-v6-1-retour-signing
          path: |
            /tmp/signed_data.bin
            /tmp/signature.bin
            /tmp/cert.der
            /tmp/pub.der
            /tmp/meta.txt
          retention-days: 1
