name: Temporary Android signing tools fetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-android-sign-tools.yml'

permissions:
  contents: read

jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle latest Android build tools
        run: |
          set -euo pipefail
          VER=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          ROOT="$ANDROID_HOME/build-tools/$VER"
          mkdir -p out/build-tools/lib
          cp "$ROOT/apksigner" out/build-tools/
          cp "$ROOT/zipalign" out/build-tools/
          cp "$ROOT/lib/apksigner.jar" out/build-tools/lib/
          if [ -f "$ROOT/aapt2" ]; then cp "$ROOT/aapt2" out/build-tools/; fi
          printf '%s\n' "$VER" > out/build-tools/VERSION.txt
          tar -C out -czf android-sign-tools.tar.gz build-tools
      - name: Upload Android tools
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools
          path: android-sign-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
