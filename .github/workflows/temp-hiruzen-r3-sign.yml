name: Temporary Hiruzen R3 signer

on:
  push:
    paths:
      - '.github/workflows/temp-hiruzen-r3-sign.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
      - name: Sign APK v2 payload
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAYLOAD_B64: ''
        run: |
          cat >/tmp/SignPayload.java <<'JAVA'
          import java.io.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public class SignPayload {
            static String hex(byte[] b){StringBuilder s=new StringBuilder(); for(byte x:b)s.append(String.format("%02X",x&0xff)); return s.toString();}
            public static void main(String[] args) throws Exception {
              char[] sp=System.getenv("KS_PASS").toCharArray();
              char[] kp=System.getenv("KEY_PASS").toCharArray();
              String alias=System.getenv("KEY_ALIAS");
              KeyStore ks=KeyStore.getInstance("JKS");
              try(InputStream in=new FileInputStream("/tmp/YUGITO_GC_RELEASE.keystore")){ks.load(in,sp);}
              PrivateKey key=(PrivateKey)ks.getKey(alias,kp);
              Certificate cert=ks.getCertificate(alias);
              byte[] payload=Base64.getDecoder().decode(System.getenv("PAYLOAD_B64"));
              Signature sig=Signature.getInstance("SHA512withRSA"); sig.initSign(key); sig.update(payload);
              System.out.println("YUGITO_CERT_SHA1="+hex(MessageDigest.getInstance("SHA-1").digest(cert.getEncoded())));
              System.out.println("YUGITO_SIG_B64="+Base64.getEncoder().encodeToString(sig.sign()));
            }
          }
          JAVA
          javac /tmp/SignPayload.java
          java -cp /tmp SignPayload
