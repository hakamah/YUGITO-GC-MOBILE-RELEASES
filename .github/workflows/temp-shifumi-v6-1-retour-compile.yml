name: Temporary Shifumi V6.1 RETOUR compiler

on:
  push:
    paths:
      - '.github/workflows/temp-shifumi-v6-1-retour-compile.yml'

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download V6 PreBattle artifact
        uses: actions/download-artifact@v4
        with:
          name: shifumi-v6-prebattle
          path: /tmp/v6
          github-token: ${{ github.token }}
          repository: hakamah/YUGITO-GC-MOBILE-RELEASES
          run-id: 34652227762
      - name: Download GDRETools
        run: |
          curl -L -o /tmp/gdre.zip https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip
          unzip -q /tmp/gdre.zip -d /tmp/gdre
          chmod +x /tmp/gdre/gdre_tools.x86_64
      - name: Decompile V6 source
        run: |
          cp /tmp/v6/PreBattle.gdc /tmp/PreBattle.gdc
          mkdir -p /tmp/src
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/src
          test -s /tmp/src/PreBattle.gd
      - name: Patch top-right RETOUR button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/src/PreBattle.gd')
          s = p.read_text()
          old = '\tvar cancel_btn: Button = _button(header, Rect2(1384, 11, 146, 42), "ANNULER", Color("ef7880"), false)\n\tcancel_btn.add_theme_font_size_override("font_size", 11)\n\tcancel_btn.pressed.connect( func() -> void : cancelled.emit())\n'
          new = '\tvar retour_btn: Button = _button(header, Rect2(1362, 8, 168, 48), "RETOUR", Color("8cb9d8"), true)\n\tretour_btn.add_theme_font_size_override("font_size", 16)\n\tretour_btn.pressed.connect( func() -> void : cancelled.emit())\n'
          assert old in s, 'target top-right block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('patched RETOUR button')
          PY
          grep -nE 'retour_btn|cancel_btn|RETOUR|ANNULER' /tmp/src/PreBattle.gd | head -60
      - name: Compile V6.1 PreBattle
        run: |
          mkdir -p /tmp/out
          /tmp/gdre/gdre_tools.x86_64 --headless --compile=/tmp/src/PreBattle.gd --bytecode=ebc36a7 --output=/tmp/out
          test -s /tmp/out/PreBattle.gdc
          sha256sum /tmp/out/PreBattle.gdc
      - name: Sanity decompile
        run: |
          mkdir -p /tmp/check
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/out/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/check
          grep -nE 'retour_btn|RETOUR' /tmp/check/PreBattle.gd | head -60
      - name: Upload compiled script
        uses: actions/upload-artifact@v4
        with:
          name: shifumi-v6-1-retour-prebattle
          path: /tmp/out/PreBattle.gdc
          retention-days: 1
