name: Temporary Shifumi V3 signer

on:
  push:
    paths:
      - '.github/workflows/temp-shifumi-v3-sign.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
      - name: Sign exact APK v2 data
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_CONTENT_DIGEST_HEX: 'aaa110ca6377c9bd7ef9765ab30c09257eb06a13f78340e56ff4a0bf43daf1ccd31477f70b8af6852dda596c5a88b4e26f7e126e16715a8535f2bc21ea6f1235'
        run: |
          cat >/tmp/ExactSign.java <<'JAVA'
          import java.io.*; import java.nio.*; import java.security.*; import java.security.cert.Certificate;
          public class ExactSign {
            static byte[] le32(int x){return ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putInt(x).array();}
            static byte[] cat(byte[]...x)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();for(byte[]b:x)o.write(b);return o.toByteArray();}
            static byte[] lp(byte[]x)throws Exception{return cat(le32(x.length),x);}
            static byte[] hex(String s){byte[]b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}
            static String hx(byte[]b){StringBuilder s=new StringBuilder();for(byte x:b)s.append(String.format("%02X",x&255));return s.toString();}
            public static void main(String[]a)throws Exception{
              char[]sp=System.getenv("KS_PASS").toCharArray(),kp=System.getenv("KEY_PASS").toCharArray();String al=System.getenv("KEY_ALIAS");
              KeyStore ks=KeyStore.getInstance("JKS");try(InputStream in=new FileInputStream("/tmp/YUGITO_GC_RELEASE.keystore")){ks.load(in,sp);} PrivateKey key=(PrivateKey)ks.getKey(al,kp); Certificate cert=ks.getCertificate(al);
              byte[]cd=hex(System.getenv("APK_CONTENT_DIGEST_HEX")),der=cert.getEncoded(),pub=cert.getPublicKey().getEncoded();
              byte[]rec=cat(le32(0x0104),lp(cd)),sd=cat(lp(lp(rec)),lp(lp(der)),lp(new byte[0])); Signature sg=Signature.getInstance("SHA512withRSA");sg.initSign(key);sg.update(sd);byte[]sig=sg.sign();
              try(FileOutputStream o=new FileOutputStream("/tmp/signed_data.bin")){o.write(sd);}try(FileOutputStream o=new FileOutputStream("/tmp/signature.bin")){o.write(sig);}try(FileOutputStream o=new FileOutputStream("/tmp/cert.der")){o.write(der);}try(FileOutputStream o=new FileOutputStream("/tmp/pub.der")){o.write(pub);}
              try(PrintWriter o=new PrintWriter("/tmp/meta.txt")){o.println("CERT_SHA1="+hx(MessageDigest.getInstance("SHA-1").digest(der)));o.println("CONTENT_DIGEST="+hx(cd));}
            }
          }
          JAVA
          javac /tmp/ExactSign.java
          java -cp /tmp ExactSign
          cat /tmp/meta.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shifumi-v3-signing
          path: |
            /tmp/signed_data.bin
            /tmp/signature.bin
            /tmp/cert.der
            /tmp/pub.der
            /tmp/meta.txt
          retention-days: 1
