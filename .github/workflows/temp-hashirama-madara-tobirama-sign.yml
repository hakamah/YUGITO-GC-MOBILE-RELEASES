name: Temporary Hashirama Madara Tobirama signer

on:
  push:
    paths:
      - '.github/workflows/temp-hashirama-madara-tobirama-sign.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
      - name: Build signing material
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_CONTENT_DIGEST_HEX: '3a6a9ae896f792bb20710a7252b494801c600142a9c431c17e2cd88ce741eabda60ef2d2c20896e287f6331ef591fcb345dfe92073f8763b5cfc53e609d62631'
        run: |
          cat >/tmp/ExactSign.java <<'JAVA'
          import java.io.*;
          import java.nio.*;
          import java.security.*;
          import java.security.cert.Certificate;
          public class ExactSign {
            static byte[] le32(int x){return ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putInt(x).array();}
            static byte[] cat(byte[]... xs)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();for(byte[] x:xs)o.write(x);return o.toByteArray();}
            static byte[] lp(byte[] x)throws Exception{return cat(le32(x.length),x);}
            static byte[] hex(String s){byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}
            static String hexOut(byte[] b){StringBuilder s=new StringBuilder();for(byte x:b)s.append(String.format("%02X",x&0xff));return s.toString();}
            public static void main(String[] args)throws Exception{
              char[] sp=System.getenv("KS_PASS").toCharArray();
              char[] kp=System.getenv("KEY_PASS").toCharArray();
              String alias=System.getenv("KEY_ALIAS");
              KeyStore ks=KeyStore.getInstance("JKS");
              try(InputStream in=new FileInputStream("/tmp/YUGITO_GC_RELEASE.keystore")){ks.load(in,sp);}
              PrivateKey key=(PrivateKey)ks.getKey(alias,kp);
              Certificate cert=ks.getCertificate(alias);
              byte[] certDer=cert.getEncoded();
              byte[] pub=cert.getPublicKey().getEncoded();
              byte[] digest=hex(System.getenv("APK_CONTENT_DIGEST_HEX"));
              byte[] rec=cat(le32(0x0104),lp(digest));
              byte[] digseq=lp(rec);
              byte[] certseq=lp(certDer);
              byte[] signedData=cat(lp(digseq),lp(certseq),lp(new byte[0]));
              Signature sig=Signature.getInstance("SHA512withRSA");sig.initSign(key);sig.update(signedData);
              byte[] signature=sig.sign();
              try(FileOutputStream o=new FileOutputStream("/tmp/signed_data.bin")){o.write(signedData);}
              try(FileOutputStream o=new FileOutputStream("/tmp/signature.bin")){o.write(signature);}
              try(FileOutputStream o=new FileOutputStream("/tmp/cert.der")){o.write(certDer);}
              try(FileOutputStream o=new FileOutputStream("/tmp/pub.der")){o.write(pub);}
              try(PrintWriter o=new PrintWriter("/tmp/meta.txt")){
                o.println("CERT_SHA1="+hexOut(MessageDigest.getInstance("SHA-1").digest(certDer)));
                o.println("CONTENT_DIGEST="+hexOut(digest));
                o.println("SIGNED_DATA_LEN="+signedData.length);
                o.println("SIGNATURE_LEN="+signature.length);
              }
            }
          }
          JAVA
          javac /tmp/ExactSign.java
          java -cp /tmp ExactSign
          cat /tmp/meta.txt
      - name: Upload signing material
        uses: actions/upload-artifact@v4
        with:
          name: hashirama-madara-tobirama-signing
          path: |
            /tmp/signed_data.bin
            /tmp/signature.bin
            /tmp/cert.der
            /tmp/pub.der
            /tmp/meta.txt
          retention-days: 1
