name: Temporary Shifumi V5 compiler

on:
  push:
    paths:
      - '.github/workflows/temp-shifumi-v5-compile.yml'

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download V4 PreBattle artifact
        uses: actions/download-artifact@v4
        with:
          name: shifumi-v4-prebattle
          path: /tmp/v4
          github-token: ${{ github.token }}
          repository: hakamah/YUGITO-GC-MOBILE-RELEASES
          run-id: 34639796398
      - name: Download GDRETools
        run: |
          curl -L -o /tmp/gdre.zip https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip
          unzip -q /tmp/gdre.zip -d /tmp/gdre
          chmod +x /tmp/gdre/gdre_tools.x86_64
      - name: Decompile V4 source
        run: |
          cp /tmp/v4/PreBattle.gdc /tmp/PreBattle.gdc
          mkdir -p /tmp/src
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/src
          test -s /tmp/src/PreBattle.gd
      - name: Apply V5 patch
        run: |
          python temp/shifumi_v5_patch.py
          grep -nE '_rps_timer_dock|TEMPS RESTANT|Révélation après verrouillage|Rect2\(260, 642, 1044, 72\)' /tmp/src/PreBattle.gd
      - name: Compile V5 PreBattle
        run: |
          mkdir -p /tmp/compiled
          /tmp/gdre/gdre_tools.x86_64 --headless --compile=/tmp/src/PreBattle.gd --bytecode=ebc36a7 --output=/tmp/compiled
          test -s /tmp/compiled/PreBattle.gdc
          sha256sum /tmp/compiled/PreBattle.gdc
      - name: Sanity decompile
        run: |
          mkdir -p /tmp/verify
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/compiled/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/verify
          grep -nE '_rps_timer_dock|TEMPS RESTANT|Révélation après verrouillage|Rect2\(260, 642, 1044, 72\)' /tmp/verify/PreBattle.gd
      - name: Upload compiled script
        uses: actions/upload-artifact@v4
        with:
          name: shifumi-v5-prebattle
          path: /tmp/compiled/PreBattle.gdc
          retention-days: 1
