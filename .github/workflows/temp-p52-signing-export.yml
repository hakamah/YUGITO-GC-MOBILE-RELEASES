name: Temporary P5.2 signing export

on:
  push:
    paths:
      - '.github/workflows/temp-p52-signing-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and encrypt signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
          cat > /tmp/session-public.pem <<'PUB'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuI9ayQsrs7KazN1NnIIs
e6mO2GMHP2vemHcBGmYV1X1EAkNip4kMkOwSZ7kUvwSzNeoKV+ytuQeQWEeg0/20
aaWkA/RP1pM1JBbTC29UPytj7xViIKelChh4fOHCbWGlG799JVIzmi4oG2fpX1jN
GhsW38FMwt4YbE55gZRpW5i2x/n9xlwjEysmrw67d7wUHTaE2szHfaEzzzjt0UPr
ONWGLXWgdx3DWYjuec4VMMxnur9wQg9PIGxfsTrEf+3cQ1j4sRFtxr9VSlCjuCR+
KqiZjZLLAB9aw+YT4cWx9W+HosatQX97dP7wfxL9DPI1+NTaJtkYM+Sbo1es0aW8
EWO7T02Z7wL5iWb2HxdvaPdl/s+WGzLBhOTdvPdMRCS+xgt5VPtxqCihB4Nkyrks
x33OWQD4SICx/ZEQTrC7cN1Y0onySXT0VefM9aL9otolSip2IB85kVTyAbJbj0u5
oaquWRsAvFYxiYSAKyRc83BCgb6Iti/CoQUjX1E/kPX9AgMBAAE=
-----END PUBLIC KEY-----
          PUB
          openssl rand -base64 48 | tr -d '\n' > /tmp/aes-pass.txt
          {
            printf 'KEY_ALIAS_B64=%s\n' "$(printf '%s' "$KEY_ALIAS" | base64 -w0)"
            printf 'KS_PASS_B64=%s\n' "$(printf '%s' "$KS_PASS" | base64 -w0)"
            printf 'KEY_PASS_B64=%s\n' "$(printf '%s' "$KEY_PASS" | base64 -w0)"
          } > /tmp/signing.env
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/aes-pass.txt -in /tmp/YUGITO_GC_RELEASE.keystore -out /tmp/YUGITO_GC_RELEASE.keystore.enc
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/aes-pass.txt -in /tmp/signing.env -out /tmp/signing.env.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/session-public.pem -in /tmp/aes-pass.txt -out /tmp/aes-pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Upload encrypted material
        uses: actions/upload-artifact@v4
        with:
          name: p52-signing-encrypted
          path: |
            /tmp/YUGITO_GC_RELEASE.keystore.enc
            /tmp/signing.env.enc
            /tmp/aes-pass.enc
          retention-days: 1
