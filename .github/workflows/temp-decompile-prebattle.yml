name: Temporary decompile PreBattle

on:
  push:
    paths:
      - '.github/workflows/temp-decompile-prebattle.yml'

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Download GDRETools
        run: |
          curl -L -o /tmp/gdre.zip https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip
          unzip -q /tmp/gdre.zip -d /tmp/gdre
          chmod +x /tmp/gdre/gdre_tools.x86_64
      - name: Recover exact current PreBattle source
        run: |
          curl -L -o /tmp/yugito.apk https://github.com/hakamah/YUGITO-GC-MOBILE-RELEASES/releases/download/GC-Mobile-2.1.4/YUGITO_GC_Mobile_Update_2.1.4.apk
          unzip -p /tmp/yugito.apk assets/scripts/PreBattle.gdc > /tmp/PreBattle.gdc
          mkdir -p /tmp/src
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/src
          test -s /tmp/src/PreBattle.gd
      - name: Patch Shifumi only
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/PreBattle.gd')
          s=p.read_text()
          s=s.replace('const RPS_REVEAL_DELAY: float = 0.42\n', 'const RPS_REVEAL_DELAY: float = 0.42\nconst RPS_RESULT_DISPLAY_SECONDS: float = 1.5\n',1)
          s=s.replace('var rps_winner: String = ""\n', 'var rps_winner: String = ""\nvar rps_texture_cache: Dictionary = {}\n',1)
          anchor='func _begin_rps(context: String) -> void :\n'
          helpers='''func _rps_image_path(choice: String) -> String:\n\tmatch choice:\n\t\t"pierre":\n\t\t\treturn "res://assets/ui/shifumi_pierre.png"\n\t\t"feuille":\n\t\t\treturn "res://assets/ui/shifumi_feuille.png"\n\t\t"ciseaux":\n\t\t\treturn "res://assets/ui/shifumi_ciseaux.png"\n\treturn ""\n\nfunc _rps_texture(choice: String) -> Texture2D:\n\tif rps_texture_cache.has(choice):\n\t\treturn rps_texture_cache[choice] as Texture2D\n\tvar path: String = _rps_image_path(choice)\n\tif path.is_empty() or not FileAccess.file_exists(path):\n\t\treturn null\n\tvar file: FileAccess = FileAccess.open(path, FileAccess.READ)\n\tif file == null:\n\t\treturn null\n\tvar bytes: PackedByteArray = file.get_buffer(file.get_length())\n\tfile.close()\n\tvar image: Image = Image.new()\n\tif image.load_png_from_buffer(bytes) != OK:\n\t\treturn null\n\tvar texture: ImageTexture = ImageTexture.create_from_image(image)\n\trps_texture_cache[choice] = texture\n\treturn texture\n\nfunc _rps_image(parent: Node, choice: String, rect: Rect2) -> TextureRect:\n\tvar art: TextureRect = TextureRect.new()\n\tart.position = rect.position\n\tart.size = rect.size\n\tart.texture = _rps_texture(choice)\n\tart.expand_mode = TextureRect.EXPAND_IGNORE_SIZE\n\tart.stretch_mode = TextureRect.STRETCH_KEEP_ASPECT_CENTERED\n\tart.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\tparent.add_child(art)\n\treturn art\n\n'''
          assert anchor in s
          s=s.replace(anchor,helpers+anchor,1)
          old='''\t\t\tvar card_panel: Panel = _panel(stage_root, Rect2(x, 190, 326, 350), Color(0.019, 0.04, 0.066, 0.96), Color(accent.r, accent.g, accent.b, 0.58), 22, 10)\n\t\t\t_label(card_panel, str(item.get("label", "")), Rect2(20, 62, 286, 54), 30, Color("f3f7fa"), HORIZONTAL_ALIGNMENT_CENTER, true)\n\t\t\t_label(card_panel, str(item.get("sub", "")), Rect2(20, 126, 286, 28), 11, accent.lightened(0.12), HORIZONTAL_ALIGNMENT_CENTER, false)\n\t\t\t_label(card_panel, "CHOIX SECRET", Rect2(20, 184, 286, 24), 8, Color("7e94a8"), HORIZONTAL_ALIGNMENT_CENTER, true)\n\t\t\tvar b: Button = _button(card_panel, Rect2(38, 244, 250, 66), "CHOISIR", accent, true)\n'''
          new='''\t\t\tvar card_panel: Panel = _panel(stage_root, Rect2(x, 190, 326, 350), Color(0.019, 0.04, 0.066, 0.96), Color(accent.r, accent.g, accent.b, 0.58), 22, 10)\n\t\t\t_rps_image(card_panel, str(item.get("id", "")), Rect2(18, 18, 290, 163))\n\t\t\t_label(card_panel, str(item.get("label", "")), Rect2(20, 188, 286, 40), 24, Color("f3f7fa"), HORIZONTAL_ALIGNMENT_CENTER, true)\n\t\t\t_label(card_panel, str(item.get("sub", "")), Rect2(20, 228, 286, 24), 10, accent.lightened(0.12), HORIZONTAL_ALIGNMENT_CENTER, false)\n\t\t\tvar b: Button = _button(card_panel, Rect2(38, 272, 250, 58), "CHOISIR", accent, true)\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''\tvar result_text: String = "ÉGALITÉ" if rps_winner == "tie" else ("VICTOIRE" if rps_winner == "ally" else "DÉFAITE")\n\tvar result_color: Color = Color("e5be4f") if rps_winner == "tie" else (ally_accent if rps_winner == "ally" else enemy_accent)\n\t_label(stage_root, result_text, Rect2(430, 528, 704, 48), 30, result_color, HORIZONTAL_ALIGNMENT_CENTER, true)\n\tvar continue_btn: Button = _button(stage_root, Rect2(590, 606, 384, 60), "REJOUER" if rps_winner == "tie" else "CONTINUER", result_color, true)\n\tif rps_winner == "tie":\n\t\tcontinue_btn.pressed.connect( func() -> void : _begin_rps(rps_context))\n\telse:\n\t\tcontinue_btn.pressed.connect(_continue_after_rps)\n\tfooter.text = "Choix révélés simultanément • %s" % result_text\n'''
          new='''\tvar result_text: String = "ÉGALITÉ" if rps_winner == "tie" else ("VICTOIRE" if rps_winner == "ally" else "DÉFAITE")\n\tvar result_color: Color = Color("e5be4f") if rps_winner == "tie" else (ally_accent if rps_winner == "ally" else enemy_accent)\n\tvar result_panel: Panel = _panel(stage_root, Rect2(406, 520, 752, 108), Color(0.01, 0.022, 0.038, 0.94), Color(result_color.r, result_color.g, result_color.b, 0.7), 20, 10)\n\t_label(result_panel, result_text, Rect2(24, 12, 704, 72), 48, result_color, HORIZONTAL_ALIGNMENT_CENTER, true)\n\t_animate_result_panel(result_panel, Vector2(0, 24))\n\tfooter.text = "Choix révélés simultanément • %s" % result_text\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''func _result_card(rect: Rect2, who: String, choice: String, accent: Color) -> Panel:\n\tvar p: Panel = _panel(stage_root, rect, Color(0.02, 0.042, 0.068, 0.94), Color(accent.r, accent.g, accent.b, 0.5), 18, 8)\n\t_label(p, who, Rect2(22, 34, rect.size.x - 44, 32), 17, accent.lightened(0.12), HORIZONTAL_ALIGNMENT_CENTER, true)\n\t_label(p, choice.to_upper(), Rect2(22, 105, rect.size.x - 44, 52), 30, Color("f4f7fb"), HORIZONTAL_ALIGNMENT_CENTER, true)\n\treturn p\n'''
          new='''func _result_card(rect: Rect2, who: String, choice: String, accent: Color) -> Panel:\n\tvar p: Panel = _panel(stage_root, rect, Color(0.02, 0.042, 0.068, 0.94), Color(accent.r, accent.g, accent.b, 0.5), 18, 8)\n\t_label(p, who, Rect2(22, 14, rect.size.x - 44, 28), 16, accent.lightened(0.12), HORIZONTAL_ALIGNMENT_CENTER, true)\n\t_rps_image(p, choice, Rect2(20, 48, rect.size.x - 40, 191))\n\t_label(p, choice.to_upper(), Rect2(22, 246, rect.size.x - 44, 34), 18, Color("f4f7fb"), HORIZONTAL_ALIGNMENT_CENTER, true)\n\treturn p\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''\trps_revealing = false\n\t_draw_rps()\n\nfunc _continue_after_rps() -> void :\n'''
          new='''\trps_revealing = false\n\t_draw_rps()\n\tvar result_timer: SceneTreeTimer = get_tree().create_timer(RPS_RESULT_DISPLAY_SECONDS)\n\tresult_timer.timeout.connect(_finish_rps_result_display)\n\nfunc _finish_rps_result_display() -> void :\n\tif rps_winner == "tie":\n\t\t_begin_rps(rps_context)\n\telif rps_winner in ["ally", "enemy"]:\n\t\t_continue_after_rps()\n\nfunc _continue_after_rps() -> void :\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          print('patched chars',len(s))
          PY
          python /tmp/patch.py
          grep -nE 'RPS_RESULT_DISPLAY_SECONDS|shifumi_pierre|_finish_rps_result_display' /tmp/src/PreBattle.gd
      - name: Compile patched PreBattle bytecode
        run: |
          mkdir -p /tmp/compiled
          /tmp/gdre/gdre_tools.x86_64 --headless --compile=/tmp/src/PreBattle.gd --bytecode=ebc36a7 --output=/tmp/compiled
          find /tmp/compiled -type f -maxdepth 2 -ls
          test -s /tmp/compiled/PreBattle.gdc
          sha256sum /tmp/compiled/PreBattle.gdc
      - name: Sanity decompile compiled bytecode
        run: |
          mkdir -p /tmp/verify
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/compiled/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/verify
          grep -nE 'RPS_RESULT_DISPLAY_SECONDS|shifumi_pierre|_finish_rps_result_display' /tmp/verify/PreBattle.gd
      - name: Upload compiled script
        uses: actions/upload-artifact@v4
        with:
          name: prebattle-shifumi-gdc
          path: /tmp/compiled/PreBattle.gdc
          retention-days: 1
