name: Temporary decompile PreBattle

on:
  push:
    paths:
      - '.github/workflows/temp-decompile-prebattle.yml'

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Download GDRETools
        run: |
          curl -L -o /tmp/gdre.zip https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.4/GDRE_tools-v2.6.4-linux.zip
          unzip -q /tmp/gdre.zip -d /tmp/gdre
          chmod +x /tmp/gdre/gdre_tools.x86_64
      - name: Download official YUGITO 2.1.4 APK and extract PreBattle
        run: |
          curl -L -o /tmp/yugito.apk https://github.com/hakamah/YUGITO-GC-MOBILE-RELEASES/releases/download/GC-Mobile-2.1.4/YUGITO_GC_Mobile_Update_2.1.4.apk
          unzip -p /tmp/yugito.apk assets/scripts/PreBattle.gdc > /tmp/PreBattle.gdc
          ls -lh /tmp/PreBattle.gdc
      - name: Directly decompile PreBattle
        run: |
          mkdir -p /tmp/out
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=ebc36a7 --output=/tmp/out || \
          /tmp/gdre/gdre_tools.x86_64 --headless --decompile=/tmp/PreBattle.gdc --bytecode=4.5.0 --output=/tmp/out || true
          find /tmp/out -maxdepth 2 -type f -print -exec sed -n '1,120p' {} \; || true
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: prebattle-direct-source
          path: /tmp/out
          retention-days: 1
