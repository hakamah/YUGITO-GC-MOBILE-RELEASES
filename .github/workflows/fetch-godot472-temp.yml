name: Temporary Godot 4.7.2 Linux fetch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-godot472-temp.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.2 Linux
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 5             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"             -o godot472.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot472.zip" | sha256sum -c -
      - name: Upload Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot472-linux
          path: godot472.zip
          retention-days: 1
