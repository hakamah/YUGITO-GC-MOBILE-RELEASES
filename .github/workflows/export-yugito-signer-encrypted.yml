name: Temporary encrypted YUGITO signer export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-yugito-signer-encrypted.yml'

permissions:
  contents: read

jobs:
  export-encrypted:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signer privately
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
          test -s /tmp/YUGITO_GC_RELEASE.keystore
          {
            printf 'KS_PASS_B64='; printf '%s' "$KS_PASS" | base64 -w0; printf '\n'
            printf 'KEY_PASS_B64='; printf '%s' "$KEY_PASS" | base64 -w0; printf '\n'
            printf 'KEY_ALIAS_B64='; printf '%s' "$KEY_ALIAS" | base64 -w0; printf '\n'
          } > /tmp/signing.env

      - name: Encrypt signer for one-time local recovery
        run: |
          set -euo pipefail
          cat > /tmp/temp_public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtTOlpnYugj+TX3z0eY4v
          OVYztrROH372QasWNI6JsAK6HwM2be51QFPxXZ2eYXh3CW8xXimK/sGSCxpFnMUF
          7Gc2RaeGzNXo8fmnSzpNgKTI64TSf0WG90QBx6pYAYDqnGc+LihRHykAhw3mrIaF
          +rO/cSI99ip0ET0zOgPfReVLhpgaNAWXqDmXe+UIvLNX3EuVEeu64kVNCaYi0hSj
          kpTyqDsObUjblHoh8NsvH2fS/poWL+MQgVfv0IQS0yhGBsJE+cd+VwxHWGP4pYv4
          IQaTCN1LpdPyKOe72QAo4XqkAFE+yb0X3iFgaxsotvl2dEw/A9RvzdOXYWDLRI8b
          xL+6MB3FwIIL3Gi0RarwRHO2gJwbxQ9+2vFE/+4mULOzzk1ovkrJrwc7GtYarRGJ
          Ak9Er7CDayEeVZn64x1Gr9qL4OU8cwmrGjpoqpkt9wGnw1enbBowUIK7dVKXbYVH
          XCp8EKMJWVAR4urz+X17ga7uoMc57poCBW5VKsd9qXPDAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          openssl rand -hex 32 > /tmp/aes-pass.txt
          for src in /tmp/YUGITO_GC_RELEASE.keystore /tmp/signing.env; do
            base=$(basename "$src")
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$src" -out "out/${base}.enc" -pass file:/tmp/aes-pass.txt
          done
          openssl pkeyutl -encrypt -pubin -inkey /tmp/temp_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/aes-pass.txt -out out/aes-pass.enc
          rm -f /tmp/YUGITO_GC_RELEASE.keystore /tmp/signing.env /tmp/aes-pass.txt /tmp/temp_public.pem

      - name: Upload encrypted signer only
        uses: actions/upload-artifact@v4
        with:
          name: yugito-signer-encrypted-once-v2
          path: out/*
          if-no-files-found: error
          retention-days: 1
