name: Temporary collection image loader signer

on:
  push:
    paths:
      - '.github/workflows/temp-artload-sign.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
      - name: Sign exact APK v2 signed-data
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAYLOAD_B64: ''
        run: |
          cat >/tmp/SignPayload.java <<'JAVA'
          import java.io.*;
          import java.security.*;
          import java.util.Base64;
          public class SignPayload {
            public static void main(String[] args) throws Exception {
              char[] sp=System.getenv("KS_PASS").toCharArray();
              char[] kp=System.getenv("KEY_PASS").toCharArray();
              String alias=System.getenv("KEY_ALIAS");
              KeyStore ks=KeyStore.getInstance("JKS");
              try(InputStream in=new FileInputStream("/tmp/YUGITO_GC_RELEASE.keystore")){ks.load(in,sp);}
              PrivateKey key=(PrivateKey)ks.getKey(alias,kp);
              byte[] payload=Base64.getDecoder().decode(System.getenv("PAYLOAD_B64"));
              Signature sig=Signature.getInstance("SHA512withRSA");
              sig.initSign(key);
              sig.update(payload);
              try(FileOutputStream o=new FileOutputStream("/tmp/signature.bin")){o.write(sig.sign());}
            }
          }
          JAVA
          javac /tmp/SignPayload.java
          java -cp /tmp SignPayload
      - name: Upload signature
        uses: actions/upload-artifact@v4
        with:
          name: artload-signature
          path: /tmp/signature.bin
          retention-days: 1
