name: Temporary P5.1 atlas signer export

on:
  push:
    paths:
      - '.github/workflows/temp-p51-atlas-signing-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and encrypt signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/YUGITO_GC_RELEASE.keystore
          cat > /tmp/session-public.pem <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApovAtOemrqwaIsqdE3Xi
          Ec1Wt+WRcjVZLU67i87lb8KVu5AyD5JIwCU/I8Eqh1pOZ7BPk1S0/ZbHKU3nmIbB
          GneQMv6AlpJfIjie4C1orFDunBzxro00QwpK5DmjZAcgcK3bkBuA/HiKB02aRihd
          1tO1IiZKMxq5E882buKq4pGHANV8HoeGKqWFCFPzLC3cu7eKV+ZO6/PjLS/96kZ5
          oLvb/UYbN1A52iGD5m73UrDJ1WXStYMF06MFl22UmyG6FuNSaebHRSNQvV/qHAZ4
          lKVQdjSuSM6wBpT438bVFjt26yzQurSThcbn68y9q2S+TzwyvqkISsKOrMkpCNiI
          o0h2hPMK8Rr124uAjlPerppMDmthFalC2zdD5mXeI8Vo2NHRlct2nx1x/KvC/wX2
          tK8bXnxaIM8sBMesiK8x9ywUapXa6MrjxlP6KpSlESwTpZM1Ql05RBLBftc5kmmc
          dqfZ0nUs8cy8HirNWfls0yUYuw8frKIpobXzRMK9+H+1AgMBAAE=
          -----END PUBLIC KEY-----
          PUB
          openssl rand -base64 48 | tr -d '\n' > /tmp/aes-pass.txt
          {
            printf 'KEY_ALIAS_B64=%s\n' "$(printf '%s' "$KEY_ALIAS" | base64 -w0)"
            printf 'KS_PASS_B64=%s\n' "$(printf '%s' "$KS_PASS" | base64 -w0)"
            printf 'KEY_PASS_B64=%s\n' "$(printf '%s' "$KEY_PASS" | base64 -w0)"
          } > /tmp/signing.env
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/aes-pass.txt -in /tmp/YUGITO_GC_RELEASE.keystore -out /tmp/YUGITO_GC_RELEASE.keystore.enc
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/aes-pass.txt -in /tmp/signing.env -out /tmp/signing.env.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/session-public.pem -in /tmp/aes-pass.txt -out /tmp/aes-pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Upload encrypted material
        uses: actions/upload-artifact@v4
        with:
          name: p51-atlas-signing-encrypted
          path: |
            /tmp/YUGITO_GC_RELEASE.keystore.enc
            /tmp/signing.env.enc
            /tmp/aes-pass.enc
          retention-days: 1
