name: Temporary Battle V1 digest signer

on:
  push:
    paths:
      - '.github/workflows/temp-battlev1-sign-digest.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore official YUGITO keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/sign
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/sign/yugito.keystore
      - name: Build APK v2 signed-data and sign it
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONTENT_DIGEST_HEX: b6ee2278e11da1c060bd687d0d8686e69b86de5c1e3ef83b21f883d08baa5c1ef26004697f319bd543b01ba43716f64ea2459972e4b0e145a50c4449d663eaca
        run: |
          cat > /tmp/sign/SignDigest.java <<'JAVA'
          import java.io.*;
          import java.nio.*;
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;

          public class SignDigest {
            static byte[] u32(int v) {
              return ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putInt(v).array();
            }
            static byte[] concat(byte[]... arrs) throws Exception {
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              for (byte[] a : arrs) o.write(a);
              return o.toByteArray();
            }
            static byte[] lp(byte[] b) throws Exception { return concat(u32(b.length), b); }
            static byte[] hex(String s) {
              byte[] out = new byte[s.length()/2];
              for (int i=0;i<out.length;i++) out[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);
              return out;
            }
            static KeyStore loadKS(char[] pass) throws Exception {
              Exception last = null;
              for (String type : new String[]{"JKS","PKCS12"}) {
                try (InputStream in = Files.newInputStream(Paths.get("/tmp/sign/yugito.keystore"))) {
                  KeyStore ks = KeyStore.getInstance(type);
                  ks.load(in, pass);
                  return ks;
                } catch (Exception e) { last = e; }
              }
              throw last;
            }
            public static void main(String[] args) throws Exception {
              char[] ksp = System.getenv("KS_PASS").toCharArray();
              char[] keyp = System.getenv("KEY_PASS").toCharArray();
              String alias = System.getenv("KEY_ALIAS");
              byte[] digest = hex(System.getenv("CONTENT_DIGEST_HEX"));
              KeyStore ks = loadKS(ksp);
              PrivateKey key = (PrivateKey)ks.getKey(alias,keyp);
              Certificate cert = ks.getCertificate(alias);
              if (key == null || cert == null) throw new RuntimeException("Official key/certificate not found");
              byte[] certDer = cert.getEncoded();
              byte[] pubDer = cert.getPublicKey().getEncoded();
              int ALG = 0x0104;
              byte[] digestRecord = concat(u32(ALG), lp(digest));
              byte[] digests = lp(digestRecord);
              byte[] certs = lp(certDer);
              byte[] attrs = new byte[0];
              byte[] signedData = concat(lp(digests), lp(certs), lp(attrs));
              Signature signer = Signature.getInstance("SHA512withRSA");
              signer.initSign(key);
              signer.update(signedData);
              byte[] sig = signer.sign();
              Files.write(Paths.get("/tmp/sign/signed_data.bin"), signedData);
              Files.write(Paths.get("/tmp/sign/signature.bin"), sig);
              Files.write(Paths.get("/tmp/sign/cert.der"), certDer);
              Files.write(Paths.get("/tmp/sign/pub.der"), pubDer);
              MessageDigest sha1 = MessageDigest.getInstance("SHA-1");
              byte[] h = sha1.digest(certDer);
              StringBuilder sb = new StringBuilder(); for(byte b:h) sb.append(String.format("%02X",b));
              System.out.println("CERT_SHA1="+sb);
              System.out.println("SIGNED_DATA="+signedData.length+" SIGNATURE="+sig.length);
            }
          }
          JAVA
          cd /tmp/sign
          javac SignDigest.java
          java SignDigest
          test -s signed_data.bin
          test -s signature.bin
          test -s cert.der
          test -s pub.der
      - name: Upload non-secret signing material
        uses: actions/upload-artifact@v4
        with:
          name: battlev1-signing-material
          path: |
            /tmp/sign/signed_data.bin
            /tmp/sign/signature.bin
            /tmp/sign/cert.der
            /tmp/sign/pub.der
          retention-days: 1
