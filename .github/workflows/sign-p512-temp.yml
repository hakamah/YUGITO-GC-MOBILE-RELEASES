name: Temporary P5.12 official signature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign-p512-temp.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/yugito.keystore
          test -s /tmp/yugito.keystore

      - name: Sign P5.12 v2 signed-data only
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNED_DATA_B64: ''
        run: |
          printf '%s' "$SIGNED_DATA_B64" | base64 --decode > /tmp/signed_data.bin
          cat > /tmp/SignBlob.java <<'EOF'
          import java.io.*;
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.*;
          public class SignBlob {
            public static void main(String[] a) throws Exception {
              String ksPath=a[0], alias=a[1]; char[] sp=a[2].toCharArray(), kp=a[3].toCharArray();
              KeyStore ks=null; Exception last=null;
              for (String t : new String[]{"PKCS12","JKS"}) {
                try { KeyStore k=KeyStore.getInstance(t); try(InputStream in=new FileInputStream(ksPath)){k.load(in,sp);} ks=k; break; } catch(Exception e){ last=e; }
              }
              if(ks==null) throw last;
              PrivateKey pk=(PrivateKey)ks.getKey(alias,kp);
              byte[] data=Files.readAllBytes(Paths.get("/tmp/signed_data.bin"));
              Signature s=Signature.getInstance("SHA512withRSA"); s.initSign(pk); s.update(data);
              byte[] sig=s.sign();
              Certificate cert=ks.getCertificate(alias);
              MessageDigest md=MessageDigest.getInstance("SHA-256");
              System.out.println("P512_SIGNATURE_B64="+Base64.getEncoder().encodeToString(sig));
              System.out.println("P512_CERT_SHA256="+HexFormat.of().formatHex(md.digest(cert.getEncoded())));
              System.out.println("P512_SIG_LEN="+sig.length);
            }
          }
          EOF
          javac /tmp/SignBlob.java
          java -cp /tmp SignBlob /tmp/yugito.keystore "$KEY_ALIAS" "$KS_PASS" "$KEY_PASS"

      - name: Remove restored keystore
        if: always()
        run: rm -f /tmp/yugito.keystore /tmp/signed_data.bin /tmp/SignBlob.java /tmp/SignBlob.class