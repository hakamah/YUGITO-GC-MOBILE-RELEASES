name: Sign YUGITO GC APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, ex: GC-Mobile-2.1.4"
        required: true
        type: string
      asset:
        description: "APK filename, ex: YUGITO_GC_Mobile_Update_2.1.4.apk"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  sign-digest-p527:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore YUGITO GC release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/yugito.keystore
          test -s /tmp/yugito.keystore

      - name: Sign P5.27 v2 digest
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONTENT_DIGEST_HEX: "d8c02aba91d001becacdcf19a6c37629c5f79792a167aceb3668615dd49accc25fdaca2161cad8b117fbe963196e3a2bd1ae953d52c15006da10017c51202f17"
        run: |
          cat > /tmp/SignP527.java <<'EOF'
          import java.io.*;
          import java.nio.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.*;

          public class SignP527 {
            static byte[] le32(int v) {
              return ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putInt(v).array();
            }
            static byte[] cat(byte[]... xs) throws Exception {
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              for (byte[] x: xs) o.write(x);
              return o.toByteArray();
            }
            static byte[] lp(byte[] x) throws Exception { return cat(le32(x.length), x); }
            static byte[] hex(String s) {
              byte[] out = new byte[s.length()/2];
              for (int i=0;i<out.length;i++) out[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);
              return out;
            }
            public static void main(String[] a) throws Exception {
              KeyStore ks=null; Exception last=null;
              for (String t : new String[]{"PKCS12","JKS"}) {
                try {
                  KeyStore k=KeyStore.getInstance(t);
                  try(InputStream in=new FileInputStream(a[0])) { k.load(in,a[2].toCharArray()); }
                  ks=k; break;
                } catch(Exception e) { last=e; }
              }
              if (ks==null) throw last;
              byte[] digest=hex(System.getenv("CONTENT_DIGEST_HEX"));
              byte[] digestRecord=cat(le32(0x0104), lp(digest));
              byte[] digests=lp(digestRecord);
              Certificate cert=ks.getCertificate(a[1]);
              byte[] certs=lp(cert.getEncoded());
              byte[] signedData=cat(lp(digests), lp(certs), lp(new byte[0]));
              PrivateKey pk=(PrivateKey)ks.getKey(a[1],a[3].toCharArray());
              Signature s=Signature.getInstance("SHA512withRSA");
              s.initSign(pk); s.update(signedData);
              byte[] sig=s.sign();
              MessageDigest md=MessageDigest.getInstance("SHA-256");
              System.out.println("P527_SIGNATURE_B64="+Base64.getEncoder().encodeToString(sig));
              System.out.println("P527_CERT_SHA256="+HexFormat.of().formatHex(md.digest(cert.getEncoded())));
              System.out.println("P527_SIG_LEN="+sig.length);
            }
          }
          EOF
          javac /tmp/SignP527.java
          java -cp /tmp SignP527 /tmp/yugito.keystore "$KEY_ALIAS" "$KS_PASS" "$KEY_PASS"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/yugito.keystore /tmp/SignP527.java /tmp/SignP527.class

  sign:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          mkdir -p work
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir work
          test -f "work/$ASSET"
          cp "work/$ASSET" work/input.apk

      - name: Restore YUGITO GC release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > work/YUGITO_GC_RELEASE.keystore

      - name: Find Android build tools
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "Using Android build-tools $BUILD_TOOLS_VERSION"

      - name: Zipalign APK
        run: |
          "$BUILD_TOOLS/zipalign" -f -p 4 work/input.apk work/aligned.apk

      - name: Sign APK with permanent YUGITO GC key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks work/YUGITO_GC_RELEASE.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "work/${{ inputs.asset }}" \
            work/aligned.apk

      - name: Verify APK signature
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "work/${{ inputs.asset }}"

      - name: Show SHA256
        run: |
          sha256sum "work/${{ inputs.asset }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: YUGITO-GC-signed-${{ inputs.tag }}
          path: work/${{ inputs.asset }}
          if-no-files-found: error
          retention-days: 30
